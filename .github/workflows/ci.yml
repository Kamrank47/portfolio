name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Verify static output
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/resume/index.html
          test -f dist/404.html
          test -f dist/resume/Kamran-Hashmi-Resume.pdf
          test -f dist/og.png
          echo "All expected files are present."

      - name: Check internal links
        run: node scripts/check-links.mjs

      - name: Enforce content security policy
        run: node scripts/check-csp.mjs

      - name: Generate SBOM
        run: npm sbom --sbom-format cyclonedx > sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.json
          retention-days: 30

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: dist
          retention-days: 7
