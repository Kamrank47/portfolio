<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: transparent; }
      .box { fill: #fbfaf4; stroke: #b6bcae; stroke-width: 1.5; rx: 6px; }
      .box-focus { fill: #0b2a22; stroke: #0b2a22; stroke-width: 1.5; rx: 6px; }
      .box-accent { fill: #fbfaf4; stroke: #0b2a22; stroke-width: 1.5; rx: 6px; }
      .box-side { fill: #f2f1ea; stroke: #b6bcae; stroke-width: 1.2; rx: 6px; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #0c1613; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; fill: #5c6a62; }
      .text-focus-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #f5f7ef; }
      .text-focus-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; fill: #c9f24d; }
      .arrow { stroke: #0b2a22; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
      .arrow-accent { stroke: #2f8a5b; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead-green); }
      .arrow-dashed { stroke: #5c6a62; stroke-width: 1.2; stroke-dasharray: 3 3; fill: none; marker-end: url(#arrowhead-gray); }

      @media (prefers-color-scheme: dark) {
        .box { fill: #101816; stroke: #31433a; }
        .box-focus { fill: #061a15; stroke: #c9f24d; }
        .box-accent { fill: #15201c; stroke: #5ee39a; }
        .box-side { fill: #0a0f0e; stroke: #1f2b25; }
        .text-title { fill: #e8efe5; }
        .text-sub { fill: #8b9c90; }
        .text-focus-title { fill: #f5f7ef; }
        .text-focus-sub { fill: #c9f24d; }
        .arrow { stroke: #c9f24d; marker-end: url(#arrowhead-lime); }
        .arrow-accent { stroke: #5ee39a; marker-end: url(#arrowhead-green); }
        .arrow-dashed { stroke: #8b9c90; marker-end: url(#arrowhead-gray); }
      }
    </style>
    <marker id="arrowhead" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#0b2a22" />
    </marker>
    <marker id="arrowhead-lime" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#c9f24d" />
    </marker>
    <marker id="arrowhead-green" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#2f8a5b" />
    </marker>
    <marker id="arrowhead-gray" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#5c6a62" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <!-- Step 1: GitHub Actions CI/CD -->
  <g transform="translate(20, 28)">
    <rect width="125" height="56" class="box" />
    <text x="12" y="20" class="text-title">GitHub Actions</text>
    <text x="12" y="34" class="text-sub">AWS OIDC Federation</text>
    <text x="12" y="47" class="text-sub">Zero long-lived keys</text>
  </g>

  <path d="M 145 56 L 175 56" class="arrow" />

  <!-- Step 2: S3 Artifacts -->
  <g transform="translate(180, 28)">
    <rect width="115" height="56" class="box" />
    <text x="12" y="20" class="text-title">Amazon S3</text>
    <text x="12" y="34" class="text-sub">Versioned Artifacts</text>
    <text x="12" y="47" class="text-sub">KMS Encrypted</text>
  </g>

  <path d="M 295 56 L 325 56" class="arrow" />

  <!-- Step 3: AWS CodeDeploy -->
  <g transform="translate(330, 28)">
    <rect width="120" height="56" class="box" />
    <text x="12" y="20" class="text-title">AWS CodeDeploy</text>
    <text x="12" y="34" class="text-sub">Blue/Green Deploy</text>
    <text x="12" y="47" class="text-sub">Automated Rollback</text>
  </g>

  <path d="M 450 56 L 480 56" class="arrow-accent" />

  <!-- Step 4: ALB + ASG -->
  <g transform="translate(485, 20)">
    <rect width="145" height="72" class="box-focus" />
    <text x="12" y="24" class="text-focus-title">EC2 Fleet + ALB</text>
    <text x="12" y="40" class="text-focus-sub">Auto Scaling Group</text>
    <text x="12" y="54" class="text-focus-sub">Target Group Routing</text>
  </g>

  <!-- Step 5: Async Pipelines (SQS + Lambda) -->
  <g transform="translate(645, 20)">
    <rect width="135" height="72" class="box-accent" />
    <text x="12" y="24" class="text-title">Async Workers</text>
    <text x="12" y="40" class="text-sub">SQS Queues + DLQs</text>
    <text x="12" y="54" class="text-sub">Serverless Lambda</text>
  </g>

  <path d="M 630 56 L 640 56" class="arrow" />

  <!-- Lower Section: Observability & Infra -->
  <g transform="translate(20, 115)">
    <rect width="430" height="85" class="box-side" />
    <text x="14" y="20" class="text-title">Self-Hosted Observability Stack</text>
    <text x="14" y="36" class="text-sub">Prometheus (Node &amp; Service Metrics) · Loki (Centralized Log Aggregation)</text>
    <text x="14" y="52" class="text-sub">Grafana Dashboards · Scraped over Security-Group-Scoped Ports</text>
    <text x="14" y="68" class="text-sub">Alertmanager alerts on latency &amp; resource starvation</text>
  </g>

  <g transform="translate(470, 115)">
    <rect width="310" height="85" class="box-side" />
    <text x="14" y="20" class="text-title">IaC &amp; Network Hardening</text>
    <text x="14" y="36" class="text-sub">Terraform Modular Architecture</text>
    <text x="14" y="52" class="text-sub">Private Subnets · Security Group Least Privilege</text>
    <text x="14" y="68" class="text-sub">Cost-optimized compute with no cluster bill</text>
  </g>

  <path d="M 550 92 L 550 110" class="arrow-dashed" />
  <path d="M 330 115 L 500 92" class="arrow-dashed" />
</svg>