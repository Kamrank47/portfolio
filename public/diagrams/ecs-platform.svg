<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: transparent; }
      .box { fill: #fbfaf4; stroke: #b6bcae; stroke-width: 1.5; rx: 6px; }
      .box-focus { fill: #0b2a22; stroke: #0b2a22; stroke-width: 1.5; rx: 6px; }
      .box-accent { fill: #fbfaf4; stroke: #0b2a22; stroke-width: 1.5; rx: 6px; }
      .box-infra { fill: #f2f1ea; stroke: #b6bcae; stroke-dasharray: 4 3; stroke-width: 1.2; rx: 6px; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #0c1613; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; fill: #5c6a62; }
      .text-focus-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #f5f7ef; }
      .text-focus-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; fill: #c9f24d; }
      .arrow { stroke: #0b2a22; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
      .arrow-accent { stroke: #2f8a5b; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead-green); }
      .arrow-dashed { stroke: #5c6a62; stroke-width: 1.2; stroke-dasharray: 3 3; fill: none; marker-end: url(#arrowhead-gray); }

      @media (prefers-color-scheme: dark) {
        .box { fill: #101816; stroke: #31433a; }
        .box-focus { fill: #061a15; stroke: #c9f24d; }
        .box-accent { fill: #15201c; stroke: #5ee39a; }
        .box-infra { fill: #0a0f0e; stroke: #1f2b25; }
        .text-title { fill: #e8efe5; }
        .text-sub { fill: #8b9c90; }
        .text-focus-title { fill: #f5f7ef; }
        .text-focus-sub { fill: #c9f24d; }
        .arrow { stroke: #c9f24d; marker-end: url(#arrowhead-lime); }
        .arrow-accent { stroke: #5ee39a; marker-end: url(#arrowhead-green); }
        .arrow-dashed { stroke: #8b9c90; marker-end: url(#arrowhead-gray); }
      }
    </style>
    <marker id="arrowhead" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#0b2a22" />
    </marker>
    <marker id="arrowhead-lime" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#c9f24d" />
    </marker>
    <marker id="arrowhead-green" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#2f8a5b" />
    </marker>
    <marker id="arrowhead-gray" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#5c6a62" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <!-- Stage 1: Source & CodePipeline -->
  <g transform="translate(20, 28)">
    <rect width="115" height="54" class="box" />
    <text x="12" y="20" class="text-title">CodePipeline</text>
    <text x="12" y="34" class="text-sub">Git Trigger</text>
    <text x="12" y="47" class="text-sub">Slack Alerting</text>
  </g>

  <path d="M 135 55 L 165 55" class="arrow" />

  <!-- Stage 2: CodeBuild -->
  <g transform="translate(170, 28)">
    <rect width="110" height="54" class="box" />
    <text x="12" y="20" class="text-title">CodeBuild</text>
    <text x="12" y="34" class="text-sub">Docker Build</text>
    <text x="12" y="47" class="text-sub">Image Scan</text>
  </g>

  <path d="M 280 55 L 310 55" class="arrow" />

  <!-- Stage 3: Amazon ECR -->
  <g transform="translate(315, 28)">
    <rect width="100" height="54" class="box" />
    <text x="12" y="20" class="text-title">Amazon ECR</text>
    <text x="12" y="34" class="text-sub">Private Registry</text>
    <text x="12" y="47" class="text-sub">KMS Encrypted</text>
  </g>

  <path d="M 415 55 L 445 55" class="arrow-accent" />

  <!-- Stage 4: ALB Ingress -->
  <g transform="translate(450, 28)">
    <rect width="115" height="54" class="box-accent" />
    <text x="12" y="20" class="text-title">ALB Ingress</text>
    <text x="12" y="34" class="text-sub">ACM TLS / HTTPS</text>
    <text x="12" y="47" class="text-sub">Path-based routing</text>
  </g>

  <path d="M 565 55 L 595 55" class="arrow-accent" />

  <!-- Stage 5: ECS Fargate Service -->
  <g transform="translate(600, 20)">
    <rect width="180" height="70" class="box-focus" />
    <text x="14" y="22" class="text-focus-title">ECS Fargate Service</text>
    <text x="14" y="38" class="text-focus-sub">Serverless Containers</text>
    <text x="14" y="52" class="text-focus-sub">CPU &amp; Memory Auto Scaling</text>
  </g>

  <!-- Data Tier -->
  <g transform="translate(540, 115)">
    <rect width="240" height="42" class="box" />
    <text x="14" y="18" class="text-title">Data Tier: PostgreSQL + Redis</text>
    <text x="14" y="32" class="text-sub">Private Isolated Subnet · SSM Parameter Store Secrets</text>
  </g>
  <path d="M 690 90 L 690 110" class="arrow" />

  <!-- Foundation: Terragrunt + Reusable Terraform Modules -->
  <g transform="translate(20, 168)">
    <rect width="760" height="38" class="box-infra" />
    <text x="16" y="18" class="text-title">Terragrunt Module Orchestration</text>
    <text x="16" y="30" class="text-sub">Dev / Prod Environments · Custom Multi-AZ VPC · Per-Tier Scoped Security Groups · S3 Remote State</text>
  </g>

  <path d="M 75 168 L 75 82" class="arrow-dashed" />
  <path d="M 505 168 L 505 82" class="arrow-dashed" />
</svg>