<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kamran Hashmi · social card</title>
    <style>
      @font-face {
        font-family: "Archivo";
        font-style: normal;
        font-weight: 100 900;
        src: url("../node_modules/@fontsource-variable/archivo/files/archivo-latin-wght-normal.woff2")
          format("woff2-variations");
      }

      @font-face {
        font-family: "JetBrains Mono";
        font-style: normal;
        font-weight: 100 800;
        src: url("../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2")
          format("woff2-variations");
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: #0b2a22;
        color: #f1f4ea;
        font-family: "Archivo", sans-serif;
        position: relative;
        overflow: hidden;
      }

      .ring {
        position: absolute;
        border: 1px solid rgba(201, 242, 77, 0.22);
        border-radius: 50%;
      }

      .ring--a {
        width: 760px;
        height: 760px;
        right: -240px;
        top: -300px;
      }

      .ring--b {
        width: 460px;
        height: 460px;
        right: -90px;
        top: -150px;
        border-color: rgba(241, 244, 234, 0.14);
      }

      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(241, 244, 234, 0.06) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(241, 244, 234, 0.06) 1px, transparent 1px);
        background-size: 80px 80px;
        mask-image: linear-gradient(to right, #000, transparent 55%);
      }

      .inner {
        position: relative;
        padding: 64px 72px;
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      .top {
        display: flex;
        align-items: center;
        gap: 14px;
        font-family: "JetBrains Mono", monospace;
        font-size: 15px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #9fb2a2;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #c9f24d;
      }

      h1 {
        margin: 34px 0 0;
        font-size: 88px;
        line-height: 0.92;
        letter-spacing: -0.045em;
        font-weight: 800;
        max-width: 15ch;
      }

      h1 em {
        font-style: normal;
        color: #c9f24d;
      }

      .role {
        margin: 22px 0 0;
        font-family: "JetBrains Mono", monospace;
        font-size: 17px;
        letter-spacing: 0.06em;
        color: #c7d3c4;
      }

      .stats {
        margin-top: auto;
        display: flex;
        gap: 44px;
        border-top: 1px solid rgba(241, 244, 234, 0.2);
        padding-top: 20px;
      }

      .stat strong {
        display: block;
        font-size: 26px;
        letter-spacing: -0.03em;
        color: #f1f4ea;
        font-variant-numeric: tabular-nums;
      }

      .stat span {
        display: block;
        margin-top: 4px;
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        letter-spacing: 0.04em;
        color: #8fa294;
      }

      .url {
        margin-left: auto;
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
        color: #c9f24d;
        align-self: flex-end;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="ring ring--a"></div>
    <div class="ring ring--b"></div>
    <div class="inner">
      <div class="top"><span class="dot"></span>DevOps engineer · Lahore</div>
      <h1>AI writes the code. I make it <em>safe</em> to run.</h1>
      <p class="role">AIOps · Kubernetes · Terraform · Guardrails</p>
      <div class="stats">
        <div class="stat"><strong>90 → 14 min</strong><span>Deploy time</span></div>
        <div class="stat"><strong>−50%</strong><span>Mean time to detect</span></div>
        <div class="stat"><strong>100%</strong><span>Credentials removed</span></div>
        <div class="stat"><strong>£9k → £3k</strong><span>Monthly infra spend</span></div>
        <span class="url">kamranhashmi.pages.dev</span>
      </div>
    </div>
  </body>
</html>
